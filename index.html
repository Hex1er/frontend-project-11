<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS Агрегатор</title>
</head>
<body>
  <div class="container-fluid bg-dark p-5">
    <div class="row">
      <div class="col-md-10 col-lg-8 mx-auto text-white">
        <h1 class="display-3 mb-0">RSS агрегатор</h1>
        <p class="lead">Начните читать RSS сегодня! Это легко, это красиво.</p>

        <form class="rss-form text-body" novalidate>
          <div class="row">
            <div class="col">
              <div class="form-floating">
                <input
                  type="text"
                  class="form-control"
                  id="url-input"
                  name="url"
                  placeholder=" "
                  autofocus
                  required
                />
                <label for="url-input">Ссылка RSS</label>
              </div>
              <p class="feedback small text-danger mt-2" style="min-height: 1.5rem;"></p>
            </div>
            <div class="col-auto">
              <button type="submit" class="btn btn-primary btn-lg px-sm-5" style="height: 3.7rem;">Добавить</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
