<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS Агрегатор</title>
</head>

<body>
  <div class="container-fluid bg-dark p-5">
    <div class="row">
      <div class="col-md-10 col-lg-8 mx-auto text-white">

        <h1 class="display-3 mb-0">RSS агрегатор</h1>
        <p class="lead">Начните читать RSS сегодня! Это легко, это красиво.</p>

        <!-- FORM -->
        <form class="rss-form text-body" novalidate>
          <div class="row">
            <div class="col">

              <div class="form-floating">
                <input
                  type="text"
                  class="form-control"
                  id="url-input"
                  aria-label="url"
                  name="url"
                  placeholder=" "
                  autofocus
                  required
                />
                <label for="url-input">Ссылка RSS</label>
              </div>

              <p class="feedback small text-danger mt-2"
                 style="min-height: 1.5rem;">
              </p>

            </div>

            <div class="col-auto">
              <button
                type="submit"
                class="btn btn-primary btn-lg px-sm-5"
                style="height: 3.7rem;"
              >
                Добавить
              </button>
            </div>

          </div>
        </form>

        <div class="row mt-5">

          <div class="col-md-6">
            <div class="feeds"></div>
          </div>

          <div class="col-md-6">
            <div class="posts"></div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <div
    class="modal fade"
    id="postModal"
    tabindex="-1"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title"></h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>

        <div class="modal-body">
          <p></p>
        </div>

        <div class="modal-footer">

          <a
            class="btn btn-primary full-article"
            target="_blank"
            rel="noopener noreferrer"
          >
          </a>

          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Закрыть
          </button>

        </div>

      </div>
    </div>
  </div>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
